name: Build and test Linux x64

on:
  push:
    branches: [linux-preview, unix-gpu-preview, output-folder-preview, main, reference-button-preview, transcora-focus-preview, input-directory-preview, codex/restorenate-1.1, codex/restorenate-1.2-test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restorenate-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install the virtual display used by CI
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Build a clean package
        shell: bash
        run: |
          set -euo pipefail
          root='package/RestoRenate'
          mkdir dist
          bash scripts/package_unix.sh "$root"
          tar -C package -czf dist/RestoRenate_1.2_Test_Linux_x64.tar.gz RestoRenate
          (cd dist && sha256sum RestoRenate_1.2_Test_Linux_x64.tar.gz > SHA256SUMS.txt)
      - name: Run the extracted package on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          mkdir fresh
          tar -C fresh -xzf dist/RestoRenate_1.2_Test_Linux_x64.tar.gz
          mv fresh/RestoRenate "fresh/RestoRenate portable"
          root="$PWD/fresh/RestoRenate portable"
          xvfb-run -a bash -e -c '
            "$1/Start.sh" &
            app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            for _ in $(seq 1 180); do
              if ! kill -0 "$app" 2>/dev/null; then wait "$app"; exit 1; fi
              if [[ -f "$1/logs/application.lock" ]]; then break; fi
              sleep 1
            done
            test -f "$1/logs/application.lock"
            sleep 2
            kill -0 "$app"
          ' _ "$root"
          xvfb-run -a "$root/runtime/python/bin/python3.12" tests/lut_controls.py "$root"
          xvfb-run -a "$root/runtime/python/bin/python3.12" tests/edit_models.py "$root"
          xvfb-run -a "$root/runtime/python/bin/python3.12" tests/unix_smoke.py "$root"
      - name: Verify that an initialized package can be moved
        shell: bash
        run: |
          set -euo pipefail
          mv "fresh/RestoRenate portable" "fresh/RestoRenate moved"
          root="$PWD/fresh/RestoRenate moved"
          "$root/runtime/python/bin/python3.12" -I -c 'import tkinter, onnxruntime'
          "$root/backend/linux-cpu/venv/bin/python" -I -c 'from pathlib import Path; import sys, torch; assert Path(sys.base_prefix) == Path(sys.argv[1]) / "runtime/python"' "$root"
      - name: Print runtime diagnostics
        if: failure()
        run: tail -n 50 fresh/RestoRenate*/logs/*.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: RestoRenate-Linux-x64
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-diagnostics
          path: fresh/RestoRenate/logs/*.log
          if-no-files-found: ignore

  rocm:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RestoRenate-Linux-x64
      - name: Verify the ROCm package and the GPU check
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf RestoRenate_1.2_Test_Linux_x64.tar.gz
          "RestoRenate/runtime/python/bin/python3.12" tests/linux_rocm_smoke.py "$PWD/RestoRenate"
      - name: Print setup diagnostics
        if: failure()
        run: tail -n 50 RestoRenate/logs/*.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rocm-diagnostics
          path: RestoRenate/logs/*.log
          if-no-files-found: ignore
