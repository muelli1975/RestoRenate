name: Build and test Linux x64

on:
  push:
    branches: [linux-preview, main]
    paths-ignore: ['.github/workflows/refresh-windows-v1.0.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restorenate-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.12-venv python3-tk libimage-exiftool-perl xvfb xauth
      - name: Build a clean package
        shell: bash
        run: |
          set -euo pipefail
          root='package/RestoRenate'
          mkdir -p "$root/_internal" dist
          cp Start.sh requirements-linux.txt README_DE_EN.txt LICENSE THIRD_PARTY.txt "$root/"
          cp -r assets vendor "$root/"
          cp ./*.py constraints-comfy-linux.txt download_manifest.json method_downloads.json exiftool_restorenate.config "$root/_internal/"
          chmod +x "$root/Start.sh"
          tar -C package -czf dist/RestoRenate_Linux_x64_Preview.tar.gz RestoRenate
          (cd dist && sha256sum RestoRenate_Linux_x64_Preview.tar.gz > SHA256SUMS.txt)
      - name: Run the extracted package on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          mkdir fresh
          tar -C fresh -xzf dist/RestoRenate_Linux_x64_Preview.tar.gz
          root="$PWD/fresh/RestoRenate"
          xvfb-run -a bash -e -c '
            "$1/Start.sh" &
            app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            for _ in $(seq 1 180); do
              if ! kill -0 "$app" 2>/dev/null; then wait "$app"; exit 1; fi
              if [[ -f "$1/logs/application.lock" ]]; then break; fi
              sleep 1
            done
            test -f "$1/logs/application.lock"
            sleep 2
            kill -0 "$app"
          ' _ "$root"
          xvfb-run -a "$root/runtime/linux-app/bin/python" tests/linux_smoke.py "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: RestoRenate-Linux-x64-Preview
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-diagnostics
          path: fresh/RestoRenate/logs/*.log
          if-no-files-found: ignore

  publish:
    needs: linux
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RestoRenate-Linux-x64-Preview
      - name: Publish Linux preview
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          tag=v1.0-linux-preview
          file=RestoRenate_Linux_x64_Preview.tar.gz
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$file" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title 'RestoRenate for Linux x64 · Preview' \
              --notes 'Ubuntu 24.04 x86-64. See README_DE.md or README.md for requirements. The automated tests cover the CPU path. NVIDIA is experimental.'
          fi
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name == \"$file\") | .digest")
          test "$actual" = "sha256:$(cut -d' ' -f1 SHA256SUMS.txt)"
