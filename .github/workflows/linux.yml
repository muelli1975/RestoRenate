name: Build and test Linux x64

on:
  push:
    branches: [linux-preview, unix-gpu-preview, output-folder-preview, main]
    paths-ignore: ['.github/workflows/refresh-windows-v1.0.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restorenate-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install the virtual display used by CI
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Build a clean package
        shell: bash
        run: |
          set -euo pipefail
          root='package/RestoRenate'
          mkdir dist
          bash scripts/package_unix.sh "$root"
          tar -C package -czf dist/RestoRenate_Linux_x64_Preview.tar.gz RestoRenate
          (cd dist && sha256sum RestoRenate_Linux_x64_Preview.tar.gz > SHA256SUMS.txt)
      - name: Run the extracted package on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          mkdir fresh
          tar -C fresh -xzf dist/RestoRenate_Linux_x64_Preview.tar.gz
          mv fresh/RestoRenate "fresh/RestoRenate portable"
          root="$PWD/fresh/RestoRenate portable"
          xvfb-run -a bash -e -c '
            "$1/Start.sh" &
            app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            for _ in $(seq 1 180); do
              if ! kill -0 "$app" 2>/dev/null; then wait "$app"; exit 1; fi
              if [[ -f "$1/logs/application.lock" ]]; then break; fi
              sleep 1
            done
            test -f "$1/logs/application.lock"
            sleep 2
            kill -0 "$app"
          ' _ "$root"
          xvfb-run -a "$root/runtime/python/bin/python3.12" tests/unix_smoke.py "$root"
      - name: Print runtime diagnostics
        if: failure()
        run: tail -n 50 fresh/RestoRenate portable/logs/*.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: RestoRenate-Linux-x64-Preview
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-diagnostics
          path: fresh/RestoRenate/logs/*.log
          if-no-files-found: ignore

  rocm:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RestoRenate-Linux-x64-Preview
      - name: Verify the ROCm package and the GPU check
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf RestoRenate_Linux_x64_Preview.tar.gz
          "RestoRenate/runtime/python/bin/python3.12" tests/linux_rocm_smoke.py "$PWD/RestoRenate"
      - name: Print setup diagnostics
        if: failure()
        run: tail -n 50 RestoRenate/logs/*.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rocm-diagnostics
          path: RestoRenate/logs/*.log
          if-no-files-found: ignore

  publish:
    needs: [linux, rocm]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RestoRenate-Linux-x64-Preview
      - name: Publish Linux preview
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS.txt
          tag=v1.0-linux-preview
          file=RestoRenate_Linux_x64_Preview.tar.gz
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$file" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title 'RestoRenate for Linux x64 · Preview' \
              --notes 'Ubuntu 24.04 x86-64. See README_DE.md or README.md for requirements.'
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --notes \
            'Portable preview for Ubuntu 24.04 x86-64. Extract the archive and run Start.sh. Python, Tk and ExifTool are included. GitHub Actions checks CPU processing and ROCm setup. NVIDIA and AMD GPU inference are experimental.'
          actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name == \"$file\") | .digest")
          test "$actual" = "sha256:$(cut -d' ' -f1 SHA256SUMS.txt)"
