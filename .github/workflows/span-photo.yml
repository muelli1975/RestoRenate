name: Check the photographic SPAN models
on:
  pull_request:
    paths: ['methods.py', 'method_downloads.json', 'model_hints.py', 'tests/span_photo.py', '.github/workflows/span-photo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install spandrel==0.4.2
      - run: python tests/span_photo.py
