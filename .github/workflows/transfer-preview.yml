name: Verify anonymous Windows preview download
on:
  push:
    branches: [codex/transfer-classic-preview]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download the public archive and compare SHA-256
        run: |
          curl --fail --silent --show-error --location --max-time 180 --output portable.zip 'https://nightly.link/muelli1975/RestoRenate/actions/runs/44774322789/RestoRenate-Windows-x64.zip'
          echo 'c75c8202189577708cb05adad03fe17cf0d55595404a84d3af0c07feea69f2fc  portable.zip' | sha256sum -c -
