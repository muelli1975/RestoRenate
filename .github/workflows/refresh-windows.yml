name: Rebuild published Windows packages
on:
  pull_request:
    paths:
      - '.github/workflows/refresh-windows.yml'
      - 'scripts/freeze_windows.py'
      - 'scripts/windows_gui.py'
      - 'scripts/*refresh*.py'
      - 'tests/windows_exe.ps1'
  push:
    branches: [release/rebuild-windows-pyinstaller]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        version: ['1.0', '1.1', '1.2', '1.3']
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyInstaller==6.22.2
      - run: python scripts/refresh_windows.py "${{ matrix.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/rebuild-windows-pyinstaller'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: restorenate-windows-asset-refresh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: verified
      - run: python scripts/publish_windows_refresh.py verified
