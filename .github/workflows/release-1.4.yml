name: Publish RestoRenate 1.4

on:
  push:
    branches: [release/v1.4]

permissions:
  actions: read
  contents: write

concurrency:
  group: restorenate-release-1.4
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect and check the three successful main builds
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          mkdir -p artifacts dist
          declare -A runs=()
          for ((attempt=1; attempt<=140; attempt++)); do
            for platform in windows linux macos; do
              if [[ -v "runs[$platform]" ]]; then continue; fi
              read -r id status conclusion < <(
                gh run list --branch main --commit "$GITHUB_SHA" --event push --workflow "$platform.yml" \
                  --json databaseId,status,conclusion --jq '.[0] // {} | [.databaseId // 0, .status // "-", .conclusion // "-"] | @tsv'
              )
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" != success ]]; then
                  echo "$platform build $id concluded with $conclusion" >&2
                  exit 1
                fi
                runs[$platform]=$id
              fi
            done
            if [[ "${#runs[@]}" == 3 ]]; then break; fi
            sleep 15
          done
          test "${#runs[@]}" = 3
          gh run download "${runs[windows]}" --name RestoRenate-Windows-x64 --dir artifacts/windows
          gh run download "${runs[linux]}" --name RestoRenate-Linux-x64 --dir artifacts/linux
          gh run download "${runs[macos]}" --name RestoRenate-macOS-AppleSilicon --dir artifacts/macos
          for platform in windows linux macos; do
            (cd "artifacts/$platform" && sha256sum --check --strict SHA256SUMS.txt)
          done
          mv artifacts/windows/RestoRenate_1.4_Windows_x64.zip dist/RestoRenate_1.4_Windows_x64.zip
          mv artifacts/linux/RestoRenate_1.4_Linux_x64.tar.gz dist/RestoRenate_1.4_Linux_x64.tar.gz
          mv artifacts/macos/RestoRenate_1.4_macOS_AppleSilicon.zip dist/RestoRenate_1.4_macOS_AppleSilicon.zip
          (cd dist && sha256sum RestoRenate_1.4_* > SHA256SUMS.txt)
      - name: Publish or refresh the verified platform packages
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.4
          download="https://github.com/$GH_REPO/releases/download/$tag"
          notes=release-notes.md
          cp .github/release-notes/v1.4.md "$notes"
          {
            printf '\n## Downloads and SHA-256\n\n'
            printf '| File | SHA-256 |\n| --- | --- |\n'
            while read -r digest name; do
              printf '| [%s](%s/%s) | `%s` |\n' "$name" "$download" "$name" "$digest"
            done < dist/SHA256SUMS.txt
            printf '\n[SHA256SUMS.txt](%s/SHA256SUMS.txt)\n' "$download"
            printf '\n[Source revision for the packages](https://github.com/%s/commit/%s)\n' "$GH_REPO" "$GITHUB_SHA"
          } >> "$notes"

          release_info() {
            gh api --paginate "repos/$GH_REPO/releases" | jq -sc --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | first // {}'
          }
          release=$(release_info)
          if [[ "$release" == '{}' ]]; then
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "RestoRenate 1.4" --notes-file "$notes" --draft
          else
            jq -e --arg sha "$GITHUB_SHA" '
              if .draft then .target_commitish == $sha
              else .immutable == false and .name == "RestoRenate 1.4" end
            ' <<< "$release"
            gh release upload "$tag" dist/* --clobber
          fi
          id=$(release_info | jq -er '.id')
          release=$(gh api "repos/$GH_REPO/releases/$id")
          jq -e '.assets | length == 4' <<< "$release"
          for path in dist/*; do
            name=${path##*/}
            read -r digest _ < <(sha256sum "$path")
            jq -e --arg name "$name" --arg digest "sha256:$digest" \
              'any(.assets[]; .name == $name and .digest == $digest and .state == "uploaded")' <<< "$release"
          done
          if jq -e '.draft' <<< "$release" >/dev/null; then
            gh release edit "$tag" --draft=false --latest --notes-file "$notes"
            test "$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')" = "$GITHUB_SHA"
          else
            gh release edit "$tag" --notes-file "$notes"
          fi
