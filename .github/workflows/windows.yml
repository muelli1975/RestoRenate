name: Build and test Windows x64

on:
  push:
    branches: [main, codex/restorenate-1.1, codex/restorenate-1.2-test, codex/restorenate-1.3-test, release/v1.2-windows]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restorenate-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RR_WINDOWS_ARCHIVE: ${{ github.ref == 'refs/heads/release/v1.2-windows' && 'RestoRenate_1.2_Windows_x64.zip' || 'RestoRenate_1.3_Test_Windows_x64.zip' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Windows package with the verified runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory original,dist | Out-Null
          $digest = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v1.0" --jq '.assets[] | select(.name == "RestoRenate_1.0_Windows_x64.zip") | .digest'
          if ($LASTEXITCODE -ne 0 -or $digest -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Published Windows archive checksum is unavailable' }
          gh release download v1.0 --pattern 'RestoRenate_1.0_Windows_x64.zip' --dir original
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download the Windows package' }
          python scripts/repack_portable.py windows original/RestoRenate_1.0_Windows_x64.zip "dist/$env:RR_WINDOWS_ARCHIVE" --smoke-dir dist/smoke --base-sha256 ($digest.Substring(7))
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed' }
          $checksum = (Get-FileHash -Algorithm SHA256 "dist/$env:RR_WINDOWS_ARCHIVE").Hash.ToLowerInvariant()
          "$checksum  $env:RR_WINDOWS_ARCHIVE" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Test the EXE from a fresh extraction
        shell: pwsh
        run: |
          $root = (Resolve-Path 'dist/smoke/RestoRenate').Path
          $launcher = Start-Process (Join-Path $root 'RestoRenate.exe') -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (!$launcher.WaitForExit(10000) -or $launcher.ExitCode -ne 0) { throw 'Launcher failed' }
          $app = $null
          for ($i=0; $i -lt 60 -and !$app; $i++) {
            $app = Get-Process pythonw -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $root 'runtime/python/pythonw.exe') -and $_.MainWindowTitle -eq 'RestoRenate – 1.3' } | Select-Object -First 1
            if (!$app) { Start-Sleep -Milliseconds 250 }
          }
          if (!$app -or !$app.Responding) {
            Get-Content (Join-Path $root 'logs/application.log') -ErrorAction SilentlyContinue
            throw 'RestoRenate window did not start'
          }
          [void]$app.CloseMainWindow()
          if (!$app.WaitForExit(10000)) { throw 'Launcher smoke-test window did not close' }
          & "$root/runtime/python/python.exe" -c "import sys; from pathlib import Path; sys.path.insert(0, 'dist/smoke/RestoRenate/_internal'); from portable_paths import ROOT; from portable_setup import Setup; assert (ROOT / 'assets/restorenate.ico').is_file(); assert Setup().root == ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Portable layout check failed' }
          $guides = @(Get-ChildItem -LiteralPath $root -File -Filter 'README*' | ForEach-Object Name | Sort-Object)
          if (($guides -join ',') -ne 'README_DE.md,README_EN.md') {
            throw 'Unexpected files in the portable package documentation'
          }
          & "$root/runtime/python/python.exe" tests/windows_controls.py $root
          if ($LASTEXITCODE -ne 0) { throw 'Windows control check failed' }
          & "$root/runtime/python/python.exe" tests/windows_startup.py $root
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup check failed' }
          & "$root/runtime/python/python.exe" tests/lut_controls.py $root
          if ($LASTEXITCODE -ne 0) { throw 'LUT check failed' }
          & "$root/runtime/python/python.exe" tests/edit_models.py $root
          if ($LASTEXITCODE -ne 0) { throw 'Edit model checks failed' }
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: windows-reference-control
          path: |
            dist/smoke/reference-controls.png
            dist/smoke/*menu-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RestoRenate-Windows-x64
          path: |
            dist/${{ env.RR_WINDOWS_ARCHIVE }}
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v1.2-windows'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RestoRenate-Windows-x64
          path: dist
      - name: Publish the tested Windows release
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum RestoRenate_1.2_Windows_x64.zip > SHA256SUMS.txt)
          gh release create v1.2 dist/RestoRenate_1.2_Windows_x64.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'RestoRenate 1.2' --latest \
            --notes-file .github/release-notes/v1.2.md
