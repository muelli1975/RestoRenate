name: Build and test Windows x64

on:
  push:
    branches: [main, codex/restorenate-1.1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restorenate-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the Windows package with the verified runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory original,dist | Out-Null
          $digest = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v1.0" --jq '.assets[] | select(.name == "RestoRenate_1.0_Windows_x64.zip") | .digest'
          if ($LASTEXITCODE -ne 0 -or $digest -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Published Windows archive checksum is unavailable' }
          gh release download v1.0 --pattern 'RestoRenate_1.0_Windows_x64.zip' --dir original
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download the Windows package' }
          python scripts/repack_portable.py windows original/RestoRenate_1.0_Windows_x64.zip dist/RestoRenate_1.1_Windows_x64.zip --smoke-dir dist/smoke --base-sha256 ($digest.Substring(7))
      - name: Test the EXE from a fresh extraction
        shell: pwsh
        run: |
          $root = (Resolve-Path 'dist/smoke/RestoRenate').Path
          $launcher = Start-Process (Join-Path $root 'RestoRenate.exe') -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (!$launcher.WaitForExit(10000) -or $launcher.ExitCode -ne 0) { throw 'Launcher failed' }
          $app = $null
          for ($i=0; $i -lt 60 -and !$app; $i++) {
            $app = Get-Process pythonw -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $root 'runtime/python/pythonw.exe') -and $_.MainWindowTitle -eq 'RestoRenate - 1.1' } | Select-Object -First 1
            if (!$app) { Start-Sleep -Milliseconds 250 }
          }
          if (!$app -or !$app.Responding) {
            Get-Content (Join-Path $root 'logs/application.log') -ErrorAction SilentlyContinue
            throw 'RestoRenate window did not start'
          }
          [void]$app.CloseMainWindow()
          if (!$app.WaitForExit(10000)) { throw 'Launcher smoke-test window did not close' }
          & "$root/runtime/python/python.exe" -c "import sys; from pathlib import Path; sys.path.insert(0, 'dist/smoke/RestoRenate/_internal'); from portable_paths import ROOT; from portable_setup import Setup; assert (ROOT / 'assets/restorenate.ico').is_file(); assert Setup().root == ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'Portable layout check failed' }
          & "$root/runtime/python/python.exe" tests/windows_controls.py $root
          if ($LASTEXITCODE -ne 0) { throw 'Windows control check failed' }
          & "$root/runtime/python/python.exe" tests/windows_startup.py $root
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup check failed' }
          & "$root/runtime/python/python.exe" tests/lut_controls.py $root
          if ($LASTEXITCODE -ne 0) { throw 'LUT check failed' }
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: windows-reference-control
          path: dist/smoke/reference-controls.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RestoRenate-Windows-x64
          path: dist/RestoRenate_1.1_Windows_x64.zip
          if-no-files-found: error
